<!doctype html>
<!--
  Fixture, not a generated game. Exercises the three paths that break silently:
  the injected THREE global, WebGL rendering inside the sandbox, and re-fitting
  when the frame changes size after boot.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Three Fit Fixture</title>
  </head>
  <body>
    <div id="hud" style="position:absolute;top:8px;left:8px;font:12px monospace;z-index:2"></div>
    <script>
      const hud = document.getElementById('hud')
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x0b0714)
      const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 500)
      camera.position.set(0, 3, 9)

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      document.body.appendChild(renderer.domElement)

      scene.add(new THREE.AmbientLight(0xffffff, 0.6))
      const key = new THREE.DirectionalLight(0xffb627, 1.1)
      key.position.set(4, 8, 5)
      scene.add(key)

      const geo = new THREE.BoxGeometry(1, 1, 1)
      const cubes = []
      for (let i = 0; i < 24; i++) {
        const m = new THREE.Mesh(
          geo,
          new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(MP.random(), 0.7, 0.6) }),
        )
        m.position.set((MP.random() - 0.5) * 12, (MP.random() - 0.5) * 5, (MP.random() - 0.5) * 8)
        scene.add(m)
        cubes.push(m)
      }

      // The whole point: size from the window, every time it changes.
      function resize() {
        const w = innerWidth
        const h = innerHeight
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2))
        renderer.setSize(w, h, false)
        camera.aspect = w / Math.max(1, h)
        camera.updateProjectionMatrix()
        hud.textContent = w + 'x' + h
      }
      addEventListener('resize', resize)
      resize()

      const inputs = {}
      MP.on('input', (data, from) => {
        inputs[from] = data
      })

      let view = null
      MP.on('state', (s) => {
        view = s
      })

      let t = 0
      function frame() {
        t += 0.016
        if (MP.isHost) {
          MP.setState({
            t: +t.toFixed(2),
            players: MP.players.map((p) => ({ id: p.id, name: p.name })),
            spin: +(t * 0.6).toFixed(3),
          })
        }
        if (view) {
          for (let i = 0; i < cubes.length; i++) {
            cubes[i].rotation.x = view.spin + i
            cubes[i].rotation.y = view.spin * 1.3 + i
          }
        }
        renderer.render(scene, camera)
        requestAnimationFrame(frame)
      }
      frame()

      MP.sendInput({ ping: true })
      MP.ready()
    </script>
  </body>
</html>
